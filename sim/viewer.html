<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mech Replay Viewer</title>
<style>
:root{--bg:#0b0e13;--panel:#161b22;--line:#2a313c;--text:#e6edf3;--dim:#8b949e;--accent:#58a6ff;--ours:#4dff88;--them:#ff5c5c}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:13px/1.4 system-ui,"Segoe UI",Arial,sans-serif}
body{display:flex;flex-direction:column;height:100vh;overflow:hidden}
body.drag{outline:3px dashed var(--accent);outline-offset:-6px}
header{display:flex;align-items:center;gap:12px;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
header h1{font-size:15px;margin:0;font-weight:600;white-space:nowrap}
#status{color:var(--dim);flex:1;min-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
button,select,.btn{background:#21262d;color:var(--text);border:1px solid #373e47;border-radius:6px;padding:5px 10px;font:inherit;cursor:pointer;user-select:none}
button:hover,.btn:hover{background:#2b313a}
button:disabled{opacity:.45;cursor:default}
label.check{display:flex;align-items:center;gap:5px;cursor:pointer;white-space:nowrap}
main{flex:1;display:flex;min-height:0}
#stage{flex:1;position:relative;min-width:0;overflow:hidden}
#cv{position:absolute;left:0;top:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none}
#hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--dim);font-size:16px;pointer-events:none}
#hint small{display:block;font-size:12px;margin-top:6px}
#side{width:300px;flex:0 0 300px;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;overflow:hidden}
#side section{padding:10px 12px;border-bottom:1px solid var(--line)}
#side h2{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);margin:0 0 6px;font-weight:600}
.row{display:flex;justify-content:space-between;gap:10px;padding:1px 0}
.row span{color:var(--dim)}
.row b{font-weight:600;text-align:right;overflow-wrap:anywhere}
.dim{color:var(--dim)}
.bar{position:relative;height:16px;background:#000;border:1px solid #444;border-radius:3px;margin:6px 0;overflow:hidden}
.bar div{position:absolute;left:0;top:0;bottom:0;background:var(--ours);width:0}
.bar span{position:absolute;inset:0;text-align:center;font-size:11px;line-height:14px;color:#fff;text-shadow:0 0 3px #000}
#resultBody table{width:100%;border-collapse:collapse;font-size:12px}
#resultBody th,#resultBody td{text-align:left;padding:2px 4px;border-bottom:1px solid var(--line)}
#resultBody th{color:var(--dim);font-weight:500}
#logSec{flex:1;display:flex;flex-direction:column;min-height:0;border-bottom:0}
#log{flex:1;overflow-y:auto;font:12px/1.5 ui-monospace,Consolas,monospace;min-height:80px}
#log div{padding:1px 0;border-bottom:1px dotted #22282f}
#controls{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--panel);border-top:1px solid var(--line);flex-wrap:wrap}
#scrub{flex:1;min-width:160px}
#timeLbl{font-variant-numeric:tabular-nums;white-space:nowrap;min-width:150px}
#btnPlay{min-width:72px}
@media (max-width:760px){
  body{height:100vh}
  main{flex-direction:column}
  #stage{flex:1 1 auto;min-height:200px}
  #side{width:auto;flex:0 0 40vh;border-left:0;border-top:1px solid var(--line)}
  #timeLbl{min-width:0}
}
</style>
</head>
<body>
<header>
  <h1>Mech Replay</h1>
  <label class="btn">Open .jsonl<input type="file" id="file" accept=".jsonl,.json,.txt" hidden></label>
  <span id="status">No replay loaded. Open a file or drop one anywhere on this page.</span>
</header>
<main>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="hint"><div>Drop a .jsonl replay here<small>or use Open .jsonl</small></div></div>
  </div>
  <aside id="side">
    <section>
      <div class="row"><span>Time</span><b id="tNow">-</b></div>
      <div class="row"><span>Alive</span><b id="alive">-</b></div>
      <div class="row"><span>Frame</span><b id="frameNo">-</b></div>
    </section>
    <section>
      <h2>Our bot</h2>
      <div class="row"><span>Mech</span><b id="ourName">-</b></div>
      <div class="bar"><div id="hpFill"></div><span id="hpTxt"></span></div>
      <div class="row"><span>Energy</span><b id="energy">-</b></div>
      <div class="row"><span>Cubes</span><b id="cubes">-</b></div>
      <div class="row"><span>Weapons</span><b id="weapons">-</b></div>
      <div class="row"><span>Label</span><b id="label">-</b></div>
    </section>
    <section>
      <h2>Result</h2>
      <div id="resultBody" class="dim">No replay loaded.</div>
    </section>
    <section id="logSec">
      <h2>Events</h2>
      <div id="log"></div>
    </section>
  </aside>
</main>
<footer id="controls">
  <button id="btnPrev" title="Step back (Left arrow)">Step -</button>
  <button id="btnPlay" title="Play / pause (Space)">Play</button>
  <button id="btnNext" title="Step forward (Right arrow)">Step +</button>
  <select id="speed" title="Playback speed">
    <option value="0.5">0.5x</option>
    <option value="1" selected>1x</option>
    <option value="2">2x</option>
    <option value="4">4x</option>
    <option value="8">8x</option>
  </select>
  <input type="range" id="scrub" min="0" max="0" value="0" step="1" disabled>
  <span id="timeLbl">- / -</span>
  <label class="check"><input type="checkbox" id="follow"> Follow our bot</label>
  <label class="check"><input type="checkbox" id="mindToggle" checked> Bot minimap</label>
  <button id="btnFit" title="Reset pan and zoom">Fit</button>
</footer>
<script>
(function(){
"use strict";
var TAU=Math.PI*2, SHOT_LIFE=0.3, LOG_MAX=500;
var SHOT_COL={gun:"#ffe033",laser:"#33e6ff",lightning:"#b266ff",mortar:"#ff8c1a"};
var ITEM_COL={crate:"#d8b04a",cube:"#7ee8fa",laser:"#33e6ff",lightning:"#b266ff",mortar:"#ff8c1a",drop:"#f2f2f2"};
var ITEM_GLYPH={crate:"C",cube:"Q",laser:"L",lightning:"Z",mortar:"M",drop:"D"};
var OURS="#4dff88", THEM="#ff5c5c", DEAD="#7d8590";

function $(id){return document.getElementById(id);}
var cv=$("cv"), ctx=cv.getContext("2d"), stage=$("stage");

// replay state
var S={
  meta:null, frames:[], result:null, buildings:[], slotTeam:{}, slotName:{},
  ourSlot:null, maxTop:1, evList:[], evCum:[], bounds:{minX:0,maxX:1,minY:0,maxY:1},
  simT:0, frameIdx:0, playing:false, speed:1, follow:false, ourMech:null,
  dirty:true, lastTs:0, W:1, H:1, dpr:1, fitScale:1, lastEvCount:-1, lastResKey:""
};
var view={cx:0,cy:0,scale:1};

function setStatus(t){$("status").textContent=t;}

// ---------- parsing ----------
function num(v,d){return (typeof v==="number"&&isFinite(v))?v:d;}

function loadText(text,name){
  var meta=null, frames=[], result=null, bad=0;
  var lines=text.split(/\r?\n/);
  for(var i=0;i<lines.length;i++){
    var s=lines[i].trim();
    if(!s) continue;
    var o;
    try{ o=JSON.parse(s); }catch(e){ bad++; continue; }
    if(!o||typeof o!=="object"){ bad++; continue; }
    if(o.type==="meta"){ if(!meta) meta=o; }
    else if(o.type==="frame"){ frames.push(o); }
    else if(o.type==="result"){ result=o; }
  }
  if(!meta){ setStatus(name+": no meta line found, not a replay file."); return; }
  if(!frames.length){ setStatus(name+": no frame lines found."); return; }
  frames.sort(function(a,b){return num(a.t,0)-num(b.t,0);});

  S.meta=meta; S.frames=frames; S.result=result;
  S.slotTeam={}; S.slotName={}; S.ourSlot=null;
  (meta.slots||[]).forEach(function(sl){
    S.slotTeam[sl.slot]=sl.team;
    S.slotName[sl.slot]=sl.name||("slot "+sl.slot);
    if(sl.team===0 && S.ourSlot===null) S.ourSlot=sl.slot;
  });

  // buildings: flat rings [x0,y0,x1,y1,...] with top height
  var maxTop=1, minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;
  S.buildings=(meta.buildings||[]).map(function(b){
    var ring=(b.ring||[]).map(function(v){return num(v,0);});
    var top=num(b.top,0), bx0=Infinity,bx1=-Infinity,by0=Infinity,by1=-Infinity;
    for(var k=0;k+1<ring.length;k+=2){
      if(ring[k]<bx0)bx0=ring[k]; if(ring[k]>bx1)bx1=ring[k];
      if(ring[k+1]<by0)by0=ring[k+1]; if(ring[k+1]>by1)by1=ring[k+1];
    }
    if(top>maxTop) maxTop=top;
    if(bx0<minX)minX=bx0; if(bx1>maxX)maxX=bx1; if(by0<minY)minY=by0; if(by1>maxY)maxY=by1;
    return {ring:ring,top:top,minX:bx0,maxX:bx1,minY:by0,maxY:by1};
  }).filter(function(b){return b.ring.length>=6;});
  S.maxTop=maxTop;

  var mb=meta.bounds;
  if(mb && isFinite(mb.minX) && isFinite(mb.maxX) && isFinite(mb.minY) && isFinite(mb.maxY)){
    S.bounds={minX:mb.minX,maxX:mb.maxX,minY:mb.minY,maxY:mb.maxY};
  }else{
    S.bounds={minX:isFinite(minX)?minX:-100,maxX:isFinite(maxX)?maxX:100,minY:isFinite(minY)?minY:-100,maxY:isFinite(maxY)?maxY:100};
  }
  if(S.bounds.maxX<=S.bounds.minX) S.bounds.maxX=S.bounds.minX+1;
  if(S.bounds.maxY<=S.bounds.minY) S.bounds.maxY=S.bounds.minY+1;

  // events flattened once, with cumulative counts per frame
  S.evList=[]; S.evCum=[];
  for(var fi=0;fi<frames.length;fi++){
    var evs=frames[fi].events||[];
    for(var e=0;e<evs.length;e++) S.evList.push(String(evs[e]));
    S.evCum.push(S.evList.length);
  }

  S.lastEvCount=-1; S.lastResKey="";
  S.simT=num(frames[0].t,0); S.frameIdx=0; S.playing=false;
  setPlaying(false);
  $("scrub").max=String(frames.length-1);
  $("scrub").disabled=false;
  $("hint").style.display="none";
  resize(); fit(); gotoIdx(0);
  var dur=result&&typeof result.duration==="number"?result.duration.toFixed(1)+" s":"no result line";
  setStatus(name+": "+frames.length+" frames, "+(meta.slots||[]).length+" slots, "+dur+(bad?", "+bad+" unreadable lines skipped":""));
}

function readFile(f){
  setStatus("Reading "+f.name+" ...");
  var r=new FileReader();
  r.onload=function(){ loadText(String(r.result),f.name); };
  r.onerror=function(){ setStatus("Could not read "+f.name); };
  r.readAsText(f);
}

// ---------- view ----------
function resize(){
  var r=stage.getBoundingClientRect();
  S.W=Math.max(1,r.width); S.H=Math.max(1,r.height);
  S.dpr=window.devicePixelRatio||1;
  cv.width=Math.round(S.W*S.dpr); cv.height=Math.round(S.H*S.dpr);
  S.dirty=true;
}
function fit(){
  var b=S.bounds, bw=b.maxX-b.minX, bh=b.maxY-b.minY;
  var sc=Math.min(S.W/bw,S.H/bh)*0.92;
  if(!(sc>0)) sc=1;
  S.fitScale=sc; view.scale=sc;
  view.cx=(b.minX+b.maxX)/2; view.cy=(b.minY+b.maxY)/2;
  S.dirty=true;
}
function zoomAt(mx,my,factor){
  var old=view.scale;
  var ns=Math.min(Math.max(old*factor,S.fitScale*0.25),120);
  var wx=view.cx+(mx-S.W/2)/old, wy=view.cy-(my-S.H/2)/old;
  view.scale=ns;
  view.cx=wx-(mx-S.W/2)/ns;
  view.cy=wy+(my-S.H/2)/ns;
  S.dirty=true;
}
function setFollow(v){
  S.follow=v; $("follow").checked=v; S.dirty=true;
}

// ---------- time / playback ----------
function idxForTime(t){
  var lo=0, hi=S.frames.length-1, ans=0;
  while(lo<=hi){
    var mid=(lo+hi)>>1;
    if(num(S.frames[mid].t,0)<=t){ ans=mid; lo=mid+1; } else { hi=mid-1; }
  }
  return ans;
}
function gotoIdx(i){
  if(!S.frames.length) return;
  i=Math.max(0,Math.min(S.frames.length-1,Math.floor(i)));
  S.frameIdx=i; S.simT=num(S.frames[i].t,0); S.dirty=true;
}
function setPlaying(p){
  if(!S.frames.length){ p=false; }
  if(p && S.frameIdx>=S.frames.length-1) gotoIdx(0);
  S.playing=p;
  $("btnPlay").textContent=p?"Pause":"Play";
}
function step(d){
  setPlaying(false);
  gotoIdx(S.frameIdx+d);
}
function tick(ts){
  if(S.playing && S.frames.length){
    var dtReal=S.lastTs?(ts-S.lastTs)/1000:0;
    S.simT+=dtReal*S.speed;
    var last=num(S.frames[S.frames.length-1].t,0);
    if(S.simT>=last){ S.simT=last; setPlaying(false); }
    var ni=idxForTime(S.simT);
    if(ni!==S.frameIdx){ S.frameIdx=ni; S.dirty=true; }
  }
  S.lastTs=S.playing?ts:0;
  if(S.dirty) render();
  requestAnimationFrame(tick);
}

// ---------- drawing ----------
function render(){
  S.dirty=false;
  var W=S.W, H=S.H, dpr=S.dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle="#0b0e13";
  ctx.fillRect(0,0,W,H);
  if(!S.frames.length) return;
  var f=S.frames[S.frameIdx];

  var mechs=f.mechs||[], om=null;
  if(S.ourSlot!==null){
    for(var i=0;i<mechs.length;i++){ if(mechs[i].slot===S.ourSlot){ om=mechs[i]; break; } }
  }
  S.ourMech=om;
  if(S.follow && om){ view.cx=num(om.x,view.cx); view.cy=num(om.y,view.cy); }

  var s=view.scale, cx=view.cx, cy=view.cy;
  function X(x){return W/2+(x-cx)*s;}
  function Y(y){return H/2-(y-cy)*s;}
  var vx0=cx-W/2/s, vx1=cx+W/2/s, vy0=cy-H/2/s, vy1=cy+H/2/s;

  // arena bounds
  var b=S.bounds;
  ctx.strokeStyle="#2b3441"; ctx.lineWidth=1;
  ctx.strokeRect(Math.round(X(b.minX))+0.5, Math.round(Y(b.maxY))+0.5, (b.maxX-b.minX)*s, (b.maxY-b.minY)*s);

  // zone: current (solid) and next (dashed)
  var z=f.zone;
  if(z){
    ctx.beginPath(); ctx.arc(X(z.cx),Y(z.cy),Math.max(0,num(z.r,0))*s,0,TAU);
    ctx.fillStyle="rgba(80,160,255,0.06)"; ctx.fill();
    ctx.setLineDash([]); ctx.strokeStyle="rgba(120,190,255,0.9)"; ctx.lineWidth=2; ctx.stroke();
    var ncx=num(z.ncx,z.cx), ncy=num(z.ncy,z.cy), nr=num(z.nr,z.r);
    ctx.beginPath(); ctx.arc(X(ncx),Y(ncy),Math.max(0,nr)*s,0,TAU);
    ctx.setLineDash([8,6]); ctx.strokeStyle="rgba(255,200,90,0.85)"; ctx.lineWidth=1.5; ctx.stroke();
    ctx.setLineDash([]);
  }

  // buildings
  ctx.lineJoin="round";
  for(var bi=0;bi<S.buildings.length;bi++){
    var bl=S.buildings[bi];
    if(bl.maxX<vx0||bl.minX>vx1||bl.maxY<vy0||bl.minY>vy1) continue;
    var ring=bl.ring, L=ring.length;
    ctx.beginPath();
    ctx.moveTo(X(ring[0]),Y(ring[1]));
    for(var k=2;k+1<L;k+=2) ctx.lineTo(X(ring[k]),Y(ring[k+1]));
    ctx.closePath();
    var t=Math.min(1,bl.top/S.maxTop);
    ctx.fillStyle="hsla(215,12%,"+(16+t*34).toFixed(1)+"%,0.95)";
    ctx.fill();
    ctx.strokeStyle="rgba(0,0,0,0.6)"; ctx.lineWidth=1; ctx.stroke();
  }

  // bot minimap overlay: what OUR bot believes (from MECH_DUMP snapshots)
  var mt=document.getElementById('mindToggle');
  if(S.mind && S.mind.length && (!mt || mt.checked)){
    var curT=num(f.t,0), lo=0, hi=S.mind.length-1, mi=-1;
    while(lo<=hi){ var md=(lo+hi)>>1; if(S.mind[md].t<=curT){ mi=md; lo=md+1; } else hi=md-1; }
    if(mi>=0){
      var M=S.mind[mi], mm=S.mindMeta, N=mm.N, cs=N*s;
      function cellXY(K){ return [mm.x0+(K%mm.nnx)*N, mm.y0+Math.floor(K/mm.nnx)*N]; }
      var dg=M.danger||[];
      for(var q=0;q<dg.length;q++){
        var c=cellXY(dg[q][0]), v=dg[q][1];
        ctx.fillStyle="rgba(255,40,40,"+Math.min(0.55,0.08+v/12)+")";
        ctx.fillRect(X(c[0]),Y(c[1]+N),cs+0.5,cs+0.5);
      }
      var ht=M.heat||[];
      ctx.strokeStyle="rgba(255,170,0,0.8)"; ctx.lineWidth=1;
      for(var q=0;q<ht.length;q++){ if(ht[q][1]<0.3) continue; var c=cellXY(ht[q][0]); ctx.strokeRect(X(c[0]),Y(c[1]+N),cs,cs); }
      var it=M.items||[];
      for(var q=0;q<it.length;q++){
        ctx.beginPath(); ctx.arc(X(it[q][1]),Y(it[q][2]),Math.max(3,2.5*s),0,TAU);
        ctx.strokeStyle=it[q][0]==="cube"?"#6cf2ff":"#7fb0ff"; ctx.lineWidth=1.5; ctx.stroke();
      }
      var tk=M.tracks||[];
      for(var q=0;q<tk.length;q++){
        var a2=Math.max(0.25,1-tk[q][2]/15);
        ctx.globalAlpha=a2; ctx.beginPath(); ctx.arc(X(tk[q][0]),Y(tk[q][1]),Math.max(6,5*s),0,TAU);
        ctx.strokeStyle="#ff4d4d"; ctx.setLineDash([4,3]); ctx.lineWidth=2; ctx.stroke(); ctx.setLineDash([]);
        ctx.fillStyle="#ff9a9a"; ctx.font="11px sans-serif";
        ctx.fillText("#"+tk[q][3]+(tk[q][2]>0.2?(" "+tk[q][2].toFixed(0)+"s"):""), X(tk[q][0])+8, Y(tk[q][1])-8);
        ctx.globalAlpha=1;
      }
      if(om && M.path && M.path.length){
        ctx.beginPath(); ctx.moveTo(X(om.x),Y(om.y));
        for(var q=0;q<M.path.length;q++) ctx.lineTo(X(M.path[q][0]),Y(M.path[q][1]));
        ctx.strokeStyle="rgba(255,255,255,0.8)"; ctx.setLineDash([6,4]); ctx.lineWidth=1.5; ctx.stroke(); ctx.setLineDash([]);
      }
      if(M.plan){
        var px2=X(M.plan[1]), py2=Y(M.plan[2]);
        ctx.strokeStyle="#00ff9c"; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(px2,py2,9,0,TAU); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(px2-12,py2); ctx.lineTo(px2+12,py2); ctx.moveTo(px2,py2-12); ctx.lineTo(px2,py2+12); ctx.stroke();
        ctx.fillStyle="#00ff9c"; ctx.font="bold 12px sans-serif"; ctx.fillText(M.plan[0]+" ("+M.plan[3]+")", px2+12, py2+14);
      }
    }
  }

  // items
  var items=f.items||[];
  ctx.font="bold 10px system-ui, sans-serif"; ctx.textAlign="center"; ctx.textBaseline="middle";
  for(var ii=0;ii<items.length;ii++){
    var it=items[ii], ix=X(it.x), iy=Y(it.y), col=ITEM_COL[it.kind]||"#aaa";
    if(ix<-10||ix>W+10||iy<-10||iy>H+10) continue;
    ctx.fillStyle="#0b0e13"; ctx.fillRect(ix-7,iy-7,14,14);
    ctx.strokeStyle=col; ctx.lineWidth=1; ctx.strokeRect(Math.round(ix-7)+0.5,Math.round(iy-7)+0.5,13,13);
    ctx.fillStyle=col; ctx.fillText(ITEM_GLYPH[it.kind]||"?",ix,iy+0.5);
  }

  // NPCs
  var npcs=f.npcs||[];
  for(var ni2=0;ni2<npcs.length;ni2++){
    var np=npcs[ni2];
    if(num(np.hp,1)<=0) continue;
    var nx=X(np.x), ny=Y(np.y);
    ctx.fillStyle="#ffa657"; ctx.fillRect(nx-3,ny-3,6,6);
    ctx.strokeStyle="#000"; ctx.lineWidth=1; ctx.strokeRect(nx-3+0.5,ny-3+0.5,5,5);
  }

  // mechs
  ctx.textAlign="center"; ctx.textBaseline="middle";
  for(var mi=0;mi<mechs.length;mi++){
    var m=mechs[mi], sx=X(m.x), sy=Y(m.y);
    if(sx<-60||sx>W+60||sy<-60||sy>H+60) continue;
    if(!m.alive){
      var d=5;
      ctx.globalAlpha=0.35; ctx.strokeStyle=DEAD; ctx.lineWidth=1.5;
      ctx.beginPath();
      ctx.moveTo(sx-d,sy-d); ctx.lineTo(sx+d,sy+d);
      ctx.moveTo(sx+d,sy-d); ctx.lineTo(sx-d,sy+d);
      ctx.stroke();
      ctx.globalAlpha=1;
      continue;
    }
    var ours=S.slotTeam[m.slot]===0;
    var col2=ours?OURS:THEM;
    var r=Math.max(4,2.5*(1+0.05*num(m.cubes,0))*s);
    ctx.beginPath(); ctx.arc(sx,sy,r,0,TAU);
    ctx.fillStyle=ours?"rgba(77,255,136,0.22)":"rgba(255,92,92,0.22)";
    ctx.fill();
    ctx.strokeStyle=col2; ctx.lineWidth=2; ctx.stroke();
    if(m.charging){
      ctx.beginPath(); ctx.arc(sx,sy,r+4,0,TAU);
      ctx.setLineDash([3,3]); ctx.lineWidth=1; ctx.strokeStyle="#ffe033"; ctx.stroke();
      ctx.setLineDash([]);
    }
    // yaw line (yaw CCW from +x, radians)
    var yaw=num(m.yaw,0), yl=r+9;
    ctx.beginPath(); ctx.moveTo(sx,sy);
    ctx.lineTo(sx+Math.cos(yaw)*yl, sy-Math.sin(yaw)*yl);
    ctx.strokeStyle=col2; ctx.lineWidth=2; ctx.stroke();
    // HP bar above
    var bw=Math.max(18,2*r+8), by=sy-r-8;
    var mh=num(m.max_hp,0)>0?m.max_hp:1;
    var frac=Math.max(0,Math.min(1,num(m.hp,0)/mh));
    ctx.fillStyle="#000"; ctx.fillRect(sx-bw/2,by,bw,4);
    ctx.fillStyle=frac>0.5?"#4dff88":(frac>0.25?"#ffd33d":"#ff5c5c");
    ctx.fillRect(sx-bw/2,by,bw*frac,4);
    ctx.strokeStyle="rgba(255,255,255,0.35)"; ctx.lineWidth=1;
    ctx.strokeRect(Math.round(sx-bw/2)+0.5,Math.round(by)+0.5,Math.round(bw)-1,3);
    // slot number below, our label further below
    ctx.font="bold 11px system-ui, sans-serif";
    ctx.fillStyle="#e6edf3";
    ctx.fillText(String(m.slot),sx,sy+r+9);
    if(ours && m.label){
      ctx.font="10px system-ui, sans-serif";
      ctx.fillStyle=OURS;
      ctx.fillText(String(m.label),sx,sy+r+22);
    }
  }

  // shots: fade over SHOT_LIFE seconds, drawn from recent frames
  var curT=num(f.t,0);
  for(var j=S.frameIdx;j>=0;j--){
    var fj=S.frames[j], age=curT-num(fj.t,0);
    if(age>=SHOT_LIFE*2) break;
    var sh=fj.shots||[];
    for(var q=0;q<sh.length;q++){
      var sp=sh[q];
      if(!sp.from||!sp.to) continue;
      // our bot's shots: thicker, longer-lived, with a white core so they stand out
      var ours=(S.ourSlot!==null && sp.by===S.ourSlot), life=ours?SHOT_LIFE*2:SHOT_LIFE;
      if(age>=life) continue;
      var a=Math.max(0,1-age/life), w=(sp.kind==="laser"?4:(sp.kind==="mortar"?3:2))*(ours?1.6:0.8);
      ctx.globalAlpha=a;
      ctx.strokeStyle=SHOT_COL[sp.kind]||"#ffffff";
      ctx.lineWidth=w;
      ctx.beginPath(); ctx.moveTo(X(sp.from[0]),Y(sp.from[1])); ctx.lineTo(X(sp.to[0]),Y(sp.to[1])); ctx.stroke();
      if(ours){
        ctx.strokeStyle="#ffffff"; ctx.lineWidth=Math.max(1,w/3);
        ctx.beginPath(); ctx.moveTo(X(sp.from[0]),Y(sp.from[1])); ctx.lineTo(X(sp.to[0]),Y(sp.to[1])); ctx.stroke();
      }
    }
  }
  ctx.globalAlpha=1;

  updateUI();
}

// ---------- side panel and controls ----------
function fmt(v){
  if(typeof v==="number"&&isFinite(v)) return (Math.round(v*10)/10).toString();
  return v==null?"-":String(v);
}

function updateUI(){
  var n=S.frames.length, f=S.frames[S.frameIdx];
  var t=num(f.t,0);
  var dur=(S.result&&typeof S.result.duration==="number")?S.result.duration:num(S.frames[n-1].t,0);
  $("scrub").value=String(S.frameIdx);
  $("timeLbl").textContent=t.toFixed(1)+" / "+dur.toFixed(1)+" s";
  $("tNow").textContent=t.toFixed(1)+" s";
  $("frameNo").textContent=(S.frameIdx+1)+" / "+n;

  var mechs=f.mechs||[], alive=0;
  for(var i=0;i<mechs.length;i++) if(mechs[i].alive) alive++;
  $("alive").textContent=alive+" / "+mechs.length;

  var om=S.ourMech;
  if(!om){
    $("ourName").textContent="-";
    $("hpFill").style.width="0";
    $("hpTxt").textContent="";
    $("energy").textContent="-";
    $("cubes").textContent="-";
    $("weapons").textContent="-";
    $("label").textContent="-";
  }else{
    $("ourName").textContent="slot "+om.slot+" "+(S.slotName[om.slot]||"");
    var mh=num(om.max_hp,0), frac=mh>0?Math.max(0,Math.min(1,num(om.hp,0)/mh)):0;
    $("hpFill").style.width=(frac*100).toFixed(1)+"%";
    $("hpTxt").textContent=Math.round(num(om.hp,0))+" / "+fmt(om.max_hp)+(om.alive?"":" (dead)");
    $("energy").textContent=fmt(om.energy);
    $("cubes").textContent=fmt(om.cubes);
    $("weapons").textContent=(om.weapons&&om.weapons.length)?om.weapons.join(", "):"none";
    $("label").textContent=om.label||"-";
  }

  // event log: rebuilt only when the number of visible events changes
  var ec=S.evCum[S.frameIdx]||0;
  if(ec!==S.lastEvCount){
    S.lastEvCount=ec;
    var log=$("log");
    log.textContent="";
    if(ec===0){
      var none=document.createElement("div"); none.className="dim"; none.textContent="(no events yet)"; log.appendChild(none);
    }
    var from=Math.max(0,ec-LOG_MAX), frag=document.createDocumentFragment();
    for(var e=from;e<ec;e++){
      var row=document.createElement("div");
      row.textContent=S.evList[e];
      frag.appendChild(row);
    }
    log.appendChild(frag);
    log.scrollTop=log.scrollHeight;
  }

  // result: shown at the end of the replay
  var atEnd=S.frameIdx===n-1;
  var key=atEnd?"end":"mid";
  if(key!==S.lastResKey){
    S.lastResKey=key;
    var body=$("resultBody");
    body.textContent="";
    if(!S.result){
      body.textContent="No result line in this file.";
      body.className="dim";
    }else if(!atEnd){
      body.textContent="Places and kills appear when the replay reaches the end ("+dur.toFixed(1)+" s).";
      body.className="dim";
    }else{
      body.className="";
      var places=S.result.places||{}, kills=S.result.kills||{};
      var rows=Object.keys(places).map(function(k){
        return {slot:+k, place:places[k], kills:kills[k]||0};
      }).sort(function(a,b){return (a.place-b.place)||(a.slot-b.slot);});
      var tbl=document.createElement("table");
      var hr=document.createElement("tr");
      ["Place","Slot","Name","Kills"].forEach(function(h){var th=document.createElement("th");th.textContent=h;hr.appendChild(th);});
      tbl.appendChild(hr);
      rows.forEach(function(r){
        var tr=document.createElement("tr");
        [r.place,r.slot,S.slotName[r.slot]||"",r.kills].forEach(function(v){
          var td=document.createElement("td"); td.textContent=String(v); tr.appendChild(td);
        });
        tbl.appendChild(tr);
      });
      body.appendChild(tbl);
      var dd=document.createElement("div"); dd.className="dim"; dd.style.marginTop="6px";
      dd.textContent="Duration "+dur.toFixed(1)+" s";
      body.appendChild(dd);
    }
  }
}

// ---------- input ----------
$("btnPlay").addEventListener("click",function(){ setPlaying(!S.playing); this.blur(); });
$("btnPrev").addEventListener("click",function(){ step(-1); this.blur(); });
$("btnNext").addEventListener("click",function(){ step(1); this.blur(); });
$("speed").addEventListener("change",function(){ S.speed=parseFloat(this.value)||1; });
$("scrub").addEventListener("input",function(){ setPlaying(false); gotoIdx(parseInt(this.value,10)||0); });
$("follow").addEventListener("change",function(){ setFollow(this.checked); if(this.checked) S.dirty=true; });
$("btnFit").addEventListener("click",function(){ fit(); this.blur(); });
$("file").addEventListener("change",function(e){
  var f=e.target.files&&e.target.files[0];
  if(f) readFile(f);
  e.target.value="";
});

window.addEventListener("keydown",function(e){
  if(e.key===" "||e.code==="Space"){
    if(!S.frames.length) return;
    e.preventDefault();
    if(e.target&&e.target.blur) e.target.blur();
    setPlaying(!S.playing);
  }else if(e.key==="ArrowLeft"||e.key==="ArrowRight"){
    if(!S.frames.length) return;
    e.preventDefault();
    var d=(e.key==="ArrowLeft"?-1:1)*(e.shiftKey?10:1);
    step(d);
  }else if(e.key==="Home"){
    if(!S.frames.length) return;
    e.preventDefault(); setPlaying(false); gotoIdx(0);
  }else if(e.key==="End"){
    if(!S.frames.length) return;
    e.preventDefault(); setPlaying(false); gotoIdx(S.frames.length-1);
  }
});

var drag=null;
cv.addEventListener("pointerdown",function(e){
  drag={x:e.clientX,y:e.clientY};
  cv.setPointerCapture(e.pointerId);
  cv.style.cursor="grabbing";
});
cv.addEventListener("pointermove",function(e){
  if(!drag) return;
  var dx=e.clientX-drag.x, dy=e.clientY-drag.y;
  drag={x:e.clientX,y:e.clientY};
  if(dx||dy){
    if(S.follow) setFollow(false);
    view.cx-=dx/view.scale;
    view.cy+=dy/view.scale;
    S.dirty=true;
  }
});
function endDrag(){ drag=null; cv.style.cursor="grab"; }
cv.addEventListener("pointerup",endDrag);
cv.addEventListener("pointercancel",endDrag);
cv.addEventListener("wheel",function(e){
  e.preventDefault();
  if(!S.frames.length) return;
  var r=cv.getBoundingClientRect();
  zoomAt(e.clientX-r.left,e.clientY-r.top,Math.exp(-e.deltaY*0.0015));
},{passive:false});

window.addEventListener("dragover",function(e){ e.preventDefault(); document.body.classList.add("drag"); });
window.addEventListener("dragleave",function(e){ if(!e.relatedTarget) document.body.classList.remove("drag"); });
window.addEventListener("drop",function(e){
  e.preventDefault();
  document.body.classList.remove("drag");
  var f=e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0];
  if(f) readFile(f);
});
window.addEventListener("resize",function(){ resize(); });

// ---------- start ----------
resize();
$("speed").value="1";
requestAnimationFrame(tick);
// Auto-load our bot's minimap snapshots from ?mind=<path> (written when MECH_DUMP is set)
(function(){var q=new URLSearchParams(location.search).get('mind');
 if(q){fetch(q).then(function(r){return r.text();}).then(function(t){
   var L=t.split('\n'), out=[];
   for(var i=0;i<L.length;i++){ if(!L[i].trim()) continue; try{ var o=JSON.parse(L[i]); if(o.type==='mind_meta') S.mindMeta=o; else if(o.type==='mind') out.push(o);}catch(e){} }
   S.mind=out; S.dirty=true; var mt=document.getElementById('mindToggle'); if(mt) mt.onchange=function(){S.dirty=true;};
 }).catch(function(e){console.error(e);});}})();
// Auto-load a replay from ?replay=<path> (works when served over http, e.g. python -m http.server)
(function(){var q=new URLSearchParams(location.search).get('replay');
 if(q){fetch(q).then(function(r){return r.text();}).then(function(t){loadText(t,q);}).catch(function(e){console.error(e);});}})();
})();
</script>
</body>
